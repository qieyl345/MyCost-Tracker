name: Feature request
description: Propose a focused improvement to the marketplace or MyCost Tracker.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - MyCost Tracker
        - Book marketplace
        - Documentation
        - CI or deployment
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What user need or limitation would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe a focused solution and any alternatives considered.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would make this request complete.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include relevant links or mockups without sharing private information.
    validations:
      required: false
