name: Bug report
description: Report a reproducible problem in the marketplace or MyCost Tracker.
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - MyCost Tracker
        - Book marketplace
        - Documentation
        - CI or deployment
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Select ...\n3. Observe ..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and app version or commit, if known.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove secrets and personal information before sharing.
    validations:
      required: false
